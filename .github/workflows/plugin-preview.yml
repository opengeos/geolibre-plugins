name: Plugin preview

# Builds GeoLibre with the plugin(s) touched by a pull request baked in, and
# publishes it to opengeos/pages-preview under geolibre-plugins/pr-<N>/.
# A sticky comment carries the URL; the preview is deleted when the PR closes.
#
#   preview #N: https://opengeos.org/pages-preview/geolibre-plugins/pr-<N>/
#
# HOW THE PLUGIN GETS IN
# GeoLibre has a drop-in folder, apps/geolibre-desktop/public/plugins/, whose
# README documents exactly this flow ("copy the plugin folder in at build/deploy
# time"). A Vite plugin scans it at build start and the app loads whatever it
# finds on startup, with no registry entry and no manifest URL. So this workflow
# only has to put each plugin folder there before `npm run build`:
#   - a committed plugins/<id>/ folder is copied as is;
#   - a registry/<id>.json entry with a `source` release zip is downloaded,
#     checked against its SHA-256 and unpacked by this repository's own
#     scripts/stage_preview_plugins.mjs, run from the base branch.
#
# WHY pull_request_target
# Fork PRs get no secrets on `pull_request`, and fork PRs are the main case we
# want previews for. The usual "pwn request" hazard does not apply: Vite copies
# public/ verbatim without bundling or executing it, so the submitted plugin
# never runs during the build -- only in the reviewer's browser, later, which is
# the entire point of a preview. To keep it that way, this job:
#   - copies ONLY plugins/<id>/ data directories out of the PR checkout, and
#     reads only its registry/<id>.json files as JSON,
#   - never runs a script, install, or build step from that checkout (the
#     zip staging script and its npm install come from the base branch),
#   - rejects plugin ids that are not plain [A-Za-z0-9._-] names,
#   - rejects symlinks, which would otherwise publish runner files to the site.
# npm ci and the build run against opengeos/GeoLibre's own committed lockfile.
#
# SETUP (one time)
# Secret PREVIEW_DEPLOY_TOKEN: a fine-grained PAT scoped to
# opengeos/pages-preview ONLY, with two permissions:
#   Contents: Read and write   -- push the preview to gh-pages
#   Pages:    Read and write   -- read: see which commit Pages last built;
#                                 write: request a rebuild when a build
#                                 errored and no later push replaced it
# The job waits until a Pages build has published the preview (see "Wait for
# the preview to go live"), after the sticky comment is posted, so the comment
# can appear a minute or two before the URL resolves. Without Pages write the
# rebuild request only logs a warning, and an errored build then fails the job
# after 10 minutes.
# The token never needs access to this repository -- the sticky comment is
# posted with this workflow's own GITHUB_TOKEN.

on:
  pull_request_target:
    types: [opened, reopened, synchronize, closed]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to build a preview for
        required: true

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: plugin-preview-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  preview:
    name: Build and deploy preview
    runs-on: ubuntu-latest
    # Skip bot-authored PRs (e.g. a Dependabot bump touches no plugin anyway).
    if: github.event_name == 'workflow_dispatch' || github.event.sender.type != 'Bot'
    steps:
      # The publish step runs `git config user.name` in the workspace root, so
      # that root has to be a git repository. Both checkouts below use `path:`,
      # which would leave it bare and fail the deploy with "not in a git
      # directory". This is the base branch (pull_request_target), so it is our
      # own trusted code, and nothing here is executed either way.
      - name: Check out this repository into the workspace root
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Resolve target PR
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Via env, never interpolated straight into the script body.
          NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
        run: |
          set -euo pipefail
          number="$NUMBER"
          {
            echo "number=$number"
            gh api "repos/${{ github.repository }}/pulls/$number" \
              --jq '"sha=\(.head.sha)\nrepo=\(.head.repo.full_name)"'
          } >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------------- build
      - name: Check out the pull request (data only, never executed)
        if: github.event.action != 'closed'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.pr.outputs.repo }}
          ref: ${{ steps.pr.outputs.sha }}
          path: plugins-pr
          persist-credentials: false
          fetch-depth: 1
          # Required by checkout v7 to read fork PR code under
          # pull_request_target. Safe here for the reasons in the header: only
          # plugin data folders are copied out, and nothing from this checkout
          # is ever executed.
          allow-unsafe-pr-checkout: true

      - name: Select the plugins this PR touches
        if: github.event.action != 'closed'
        id: select
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          ids=$(gh api --paginate "repos/${{ github.repository }}/pulls/$PR/files" \
                  --jq '.[].filename' \
                | awk -F/ '$1 == "plugins" && NF > 2 { print $2 }' | sort -u)
          selected=()
          for id in $ids; do
            # Reject anything that is not a plain directory name, so a crafted
            # path cannot escape plugins/ when it is used below.
            if ! printf '%s' "$id" | grep -qE '^[A-Za-z0-9._-]+$'; then
              echo "::error::Refusing suspicious plugin directory name: $id"
              exit 1
            fi
            dir="plugins-pr/plugins/$id"
            # A deleted plugin has changed files but no directory; skip it.
            [ -f "$dir/plugin.json" ] || continue
            # Symlinks would let a PR publish arbitrary runner files (including
            # anything the build wrote) to a public site. Refuse outright.
            if [ -n "$(find "$dir" -type l -print -quit)" ]; then
              echo "::error::Plugin $id contains a symlink; refusing to publish it."
              exit 1
            fi
            selected+=("$id")
          done
          if [ ${#selected[@]} -eq 0 ]; then
            echo "No committed plugin folders changed."
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "Selected: ${selected[*]}"
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "ids=${selected[*]}" >> "$GITHUB_OUTPUT"
          fi

      # Release-zip plugins: the PR changes registry/<id>.json, not a folder.
      # This runs the base branch's own staging script (the workspace root is
      # the base checkout), with the base branch's lockfile, and no secrets.
      - name: Set up Node.js for staging release-zip plugins
        if: github.event.action != 'closed'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Stage release-zip plugins
        if: github.event.action != 'closed'
        id: sources
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          files=$(gh api --paginate "repos/${{ github.repository }}/pulls/$PR/files" \
                    --jq '.[] | select(.status != "removed") | .filename' \
                  | grep -E '^registry/[a-z0-9._-]+\.json$' || true)
          if [ -z "$files" ]; then
            echo "ids=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          GH_TOKEN= npm ci --ignore-scripts
          # One registry path per line; the names are plain [a-z0-9._-].
          mapfile -t file_list <<< "$files"
          status=0
          GH_TOKEN= node scripts/stage_preview_plugins.mjs plugins-pr staged "${file_list[@]}" \
            > stage-ids.txt 2> stage.log || status=$?
          cat stage.log >&2
          ids=$(tr '\n' ' ' < stage-ids.txt)
          # A zip that failed to stage (a transient 404, say), or a crash of
          # the script itself, isn't the same as "no plugin changes", so the
          # stale-preview check below must not remove a good preview for it.
          failed=$(grep -c '^::error::' stage.log || true)
          if [ "$status" -ne 0 ]; then
            echo "::error::Staging release-zip plugins failed (exit $status)."
            failed=$((failed + 1))
          fi
          echo "Release-zip plugins: ${ids:-none}; failed: $failed"
          {
            echo "ids=$ids"
            echo "failed=$failed"
          } >> "$GITHUB_OUTPUT"

      - name: Plan the preview
        if: github.event.action != 'closed'
        id: plan
        env:
          COMMITTED: ${{ steps.select.outputs.ids }}
          SOURCES: ${{ steps.sources.outputs.ids }}
        run: |
          set -euo pipefail
          ids=$(echo $COMMITTED $SOURCES | tr ' ' '\n' | sort -u | tr '\n' ' ' | xargs)
          if [ -z "$ids" ]; then
            echo "No plugins changed; skipping preview."
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "Previewing: $ids"
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "ids=$ids" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out GeoLibre
        if: github.event.action != 'closed' && steps.plan.outputs.found == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: opengeos/GeoLibre
          path: geolibre
          persist-credentials: false

      - name: Bake the plugins into the build
        if: github.event.action != 'closed' && steps.plan.outputs.found == 'true'
        env:
          IDS: ${{ steps.plan.outputs.ids }}
        run: |
          set -euo pipefail
          dest=geolibre/apps/geolibre-desktop/public/plugins
          mkdir -p "$dest"
          for id in $IDS; do
            # A staged release zip wins: it is what the registry entry the PR
            # changes will serve. Otherwise the committed folder.
            if [ -d "staged/$id" ]; then
              cp -r "staged/$id" "$dest/$id"
            else
              cp -r "plugins-pr/plugins/$id" "$dest/$id"
            fi
            echo "baked in: $id"
          done
          ls -la "$dest"

      - name: Set up Node.js
        if: github.event.action != 'closed' && steps.plan.outputs.found == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: geolibre/package-lock.json

      - name: Install dependencies
        if: github.event.action != 'closed' && steps.plan.outputs.found == 'true'
        working-directory: geolibre
        run: npm ci

      - name: Build the web app
        if: github.event.action != 'closed' && steps.plan.outputs.found == 'true'
        working-directory: geolibre
        env:
          # Relative base: the preview is served from a subdirectory, not root.
          GEOLIBRE_APP_BASE: ./
          # Optional. Absent secrets resolve to "" and simply disable the
          # corresponding data source, which does not affect plugin testing.
          VITE_GEE_OAUTH_CLIENT_ID: ${{ secrets.VITE_GEE_OAUTH_CLIENT_ID }}
          VITE_PROTOMAPS_API_KEY: ${{ secrets.VITE_PROTOMAPS_API_KEY }}
          VITE_MAPILLARY_ACCESS_TOKEN: ${{ secrets.VITE_MAPILLARY_ACCESS_TOKEN }}
        run: npm run build -w geolibre-desktop

      # Vite copies public/ verbatim, so GeoLibre's public/plugins/.gitignore
      # ("*", keeping only itself and README.md -- it exists so private plugin
      # bundles stay out of that repo's history) lands in dist/plugins/. The
      # deploy step publishes by running `git add`, which HONORS that file and
      # silently drops the plugin we just baked in: the build looks fine, the
      # site 404s on plugin.json. Strip every .gitignore from the output, not
      # just that one, since a submitted plugin can ship its own.
      - name: Strip .gitignore files that would exclude the build from the deploy
        if: github.event.action != 'closed' && steps.plan.outputs.found == 'true'
        run: |
          set -euo pipefail
          find geolibre/apps/geolibre-desktop/dist -name .gitignore -print -delete

      # The plugin reaching dist/ is the entire point of this workflow, and the
      # .gitignore bug above proved a green build says nothing about that. Fail
      # here rather than shipping a preview that 404s on its own plugin.
      - name: Verify the plugins reached the build output
        if: github.event.action != 'closed' && steps.plan.outputs.found == 'true'
        env:
          IDS: ${{ steps.plan.outputs.ids }}
        run: |
          set -euo pipefail
          dist=geolibre/apps/geolibre-desktop/dist
          for id in $IDS; do
            if [ ! -f "$dist/plugins/$id/plugin.json" ]; then
              echo "::error::$id is missing from the build output ($dist/plugins/$id/plugin.json)."
              find "$dist/plugins" -maxdepth 2 || true
              exit 1
            fi
            echo "present in build: $id"
          done

      - name: Check the build fits GitHub Pages
        if: github.event.action != 'closed' && steps.plan.outputs.found == 'true'
        run: |
          set -euo pipefail
          dist=geolibre/apps/geolibre-desktop/dist
          echo "preview size: $(du -sh "$dist" | cut -f1)"
          # 104857600 bytes = 100 MB, the Pages per-file hard limit.
          oversized=$(find "$dist" -type f -size +104857600c -printf '%s\t%p\n' || true)
          if [ -n "$oversized" ]; then
            echo "::error::Files exceed the 100 MB GitHub Pages limit:"
            echo "$oversized"
            exit 1
          fi

      # A later push can drop every plugin change (a revert, say). Remove the
      # preview built earlier, but only when one exists, so PRs that never
      # touched a plugin don't get a "preview removed" comment. "Exists" means
      # the action's own sticky comment (marker "pr-preview") still shows the
      # preview URL; its "removed" text has no URL, so a removal never repeats.
      # Verified against the SHA-pinned rossjrw/pr-preview-action v1.8.1 used
      # below (its marocchino/sticky-pull-request-comment step writes the
      # marker); re-check this when bumping that pin.
      - name: Check for an earlier preview
        if: >-
          github.event.action != 'closed' &&
          steps.plan.outputs.found != 'true' &&
          (steps.sources.outputs.failed == '' || steps.sources.outputs.failed == '0')
        id: stale
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          count=$(gh api --paginate "repos/${{ github.repository }}/issues/$PR/comments" \
                    --jq "[.[] | select(.user.login == \"github-actions[bot]\") | select(.body | contains(\"Sticky Pull Request Commentpr-preview\")) | select(.body | contains(\"geolibre-plugins/pr-$PR/\"))] | length" \
                  | awk '{s += $1} END {print s + 0}')
          echo "Earlier preview comments found: $count"
          echo "exists=$([ "$count" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------------------- deploy
      # Removes the preview instead of deploying when the PR is closed, or when
      # an open PR no longer changes any plugin but had a preview before.
      - name: Publish preview
        id: publish
        if: >-
          github.event.action == 'closed' ||
          steps.plan.outputs.found == 'true' ||
          steps.stale.outputs.exists == 'true'
        # Pinned to a SHA rather than the mutable v1 tag: unlike the first-party
        # actions/* steps above, this is a third-party action and it receives
        # PREVIEW_DEPLOY_TOKEN, so a moved tag would hand that token to code
        # nobody reviewed.
        uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9 # v1.8.1
        with:
          source-dir: geolibre/apps/geolibre-desktop/dist
          deploy-repository: opengeos/pages-preview
          token: ${{ secrets.PREVIEW_DEPLOY_TOKEN }}
          pages-base-url: opengeos.org/pages-preview
          preview-branch: gh-pages
          # pages-preview is shared across opengeos repositories, and the action
          # composes the path as "<umbrella-dir>/pr-<number>". Namespacing by
          # this repository's name is what keeps our pr-35 from colliding with
          # another repository's pr-35.
          umbrella-dir: geolibre-plugins
          pr-number: ${{ steps.pr.outputs.number }}
          action: ${{ (github.event.action == 'closed' || steps.plan.outputs.found != 'true') && 'remove' || 'deploy' }}
          # The action's own wait fails the job whenever Pages reports *its*
          # commit's build as errored. pages-preview is shared, and its legacy
          # branch builds error when the next push (from any repository)
          # supersedes them, although that next build publishes this preview
          # too. The step below waits for the preview itself instead.
          wait-for-pages-deployment: false

      # Wait until GitHub Pages has published this preview: the newest
      # successful Pages build of pages-preview is the commit the preview was
      # pushed as, or a later one that contains it. Asked of the GitHub API,
      # not the site: opengeos.org is behind Cloudflare, which answers 403 to
      # requests from GitHub Actions runners. If no build has published it
      # after a few minutes (an errored build that no later push replaced),
      # ask Pages to rebuild once.
      - name: Wait for the preview to go live
        if: github.event.action != 'closed' && steps.plan.outputs.found == 'true'
        env:
          DEPLOYED: ${{ steps.publish.outputs.deployed-commit-sha }}
          PREVIEW_URL: ${{ steps.publish.outputs.preview-url }}
          GH_TOKEN: ${{ secrets.PREVIEW_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          repo=opengeos/pages-preview
          if ! [[ "$DEPLOYED" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The preview action reported no deployed commit ('$DEPLOYED')."
            exit 1
          fi
          live() {
            local built status
            built=$(gh api "repos/$repo/pages/builds?per_page=20" \
                      --jq '[.[] | select(.status == "built")][0].commit // ""') || return 1
            [ -n "$built" ] || return 1
            # "identical" or "ahead": that build includes the preview's commit.
            status=$(gh api "repos/$repo/compare/$DEPLOYED...$built" --jq .status) || return 1
            [ "$status" = identical ] || [ "$status" = ahead ]
          }
          rebuilt=false
          for attempt in $(seq 1 40); do
            if live; then
              echo "Preview is live: $PREVIEW_URL"
              exit 0
            fi
            if [ "$attempt" = 12 ] && [ "$rebuilt" = false ]; then
              echo "Not published after 3 minutes; requesting a Pages rebuild of $repo."
              gh api -X POST "repos/$repo/pages/builds" --silent \
                || echo "::warning::Could not request a Pages rebuild (token without Pages write?)."
              rebuilt=true
            fi
            sleep 15
          done
          echo "::error::No GitHub Pages build of $repo published $DEPLOYED within 10 minutes."
          exit 1
