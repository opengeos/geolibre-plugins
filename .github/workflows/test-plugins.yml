name: Test Plugins

on:
  pull_request:
  push:
    branches: [main]
  # Pull requests only import the plugins they touch, so re-import every plugin
  # nightly to catch anything that breaks without a change here.
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Pull requests diff against their base to find changed plugins. The
          # values are strings because a bare 0 is falsy in `&& ||` expressions.
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate plugin installation metadata
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            node scripts/validate_plugins.mjs --changed-since "$BASE_SHA"
          else
            node scripts/validate_plugins.mjs
          fi

      - name: Generate plugin-registry.json
        run: node scripts/build_registry.mjs

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install docs dependencies
        run: pip install -r requirements.txt

      - name: Build docs and published bundle layout
        run: |
          python scripts/generate_plugins_page.py
          mkdocs build --strict
          cp plugin-registry.json site/
          mkdir -p site/plugins
          cp -r plugins/. site/plugins/
          cp -r schemas site/
          cp CNAME .nojekyll site/
