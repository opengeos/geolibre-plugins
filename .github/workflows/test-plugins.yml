name: Test Plugins

on:
  pull_request:
  push:
    branches: [main]
  # Pull requests only import the plugins they touch, so re-import every plugin
  # nightly to catch anything that breaks without a change here, and check the
  # live site (the live-site job).
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Pull requests diff against their base to find changed plugins. The
          # values are strings because a bare 0 is falsy in `&& ||` expressions.
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Release zips are content-addressed by SHA-256, so a cached copy is
      # always the right one.
      - name: Cache release zips
        uses: actions/cache@v6
        with:
          path: .cache/sources
          key: release-zips-${{ hashFiles('registry/*.json') }}
          restore-keys: release-zips-

      - name: Validate plugin installation metadata
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            node scripts/validate_plugins.mjs --changed-since "$BASE_SHA"
          else
            node scripts/validate_plugins.mjs
          fi

      # The mirror Worker, and the scripts that unpack untrusted release zips.
      - name: Run the unit tests
        run: npm test

      - name: Generate plugin-registry.json
        run: node scripts/build_registry.mjs

      - name: Plan the R2 mirror upload
        run: node scripts/publish_sources.mjs --dry-run

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install docs dependencies
        run: pip install -r requirements.txt

      - name: Build docs and published bundle layout
        run: |
          python scripts/generate_plugins_page.py
          mkdocs build --strict
          cp plugin-registry.json blocklist.json site/
          # Committed plugin folders, if any; release-zip plugins are served
          # from R2 instead.
          if [ -d plugins ]; then
            mkdir -p site/plugins
            cp -r plugins/. site/plugins/
          fi
          cp -r schemas site/
          cp CNAME .nojekyll site/

  # Between deploys nothing else watches the live site, so an R2, Worker or
  # Pages problem would go unnoticed until a user reported it. A failed
  # scheduled run emails whoever last changed the schedule.
  live-site:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check every published plugin against its registry hash
        run: node scripts/check_deployed.mjs https://plugins.geolibre.app/

      - name: Check the usage counts are current and rolled up
        run: node scripts/check_stats.mjs https://plugins.geolibre.app/
